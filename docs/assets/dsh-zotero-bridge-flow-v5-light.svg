<text x="772" y="482" fill="#4d5261" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11.5">no PUT · POST · DELETE anywhere</text>
<text x="772" y="502" fill="#8f94a4" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="10.5">GET + SELECT on a temporary copy</text>
<path d="M730 245.0 H742" fill="none" stroke="#4B67B4" stroke-width="1.6" stroke-linecap="round"/>
<path d="M742 210 V471" fill="none" stroke="#4B67B4" stroke-width="1.6" stroke-linecap="round"/>
<line x1="742" y1="194" x2="750" y2="194" stroke="#4B67B4" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="742" y1="349" x2="750" y2="349" stroke="#4B67B4" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="742" y1="471" x2="750" y2="471" stroke="#4B67B4" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="44" y1="420" x2="714" y2="420" stroke="#dcd8ea" stroke-width="1"/>
<text x="44" y="444" fill="#8f94a4" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11">zotero_status reports the active mode; when both paths fail it returns unavailable with concrete steps, never an empty result.</text>
<text x="44" y="464" fill="#8f94a4" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11">zotero_to_rep never downloads attachments: the bridge keeps the path so dsh-doc-anchor can anchor the full text.</text>
<line x1="44" y1="564" x2="1056" y2="564" stroke="#dcd8ea" stroke-width="1"/>
<text x="44" y="588" fill="#4d5261" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11.5">config: enabled · root .zotero-bridge · localApiUrl http://127.0.0.1:23119 (loopback only) · dataDir · timeoutMs 10000 · maxResults 25</text>
<text x="44" y="610" fill="#8f94a4" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11.5">boundary: GET + SELECT only · never api.zotero.org · no Web API key · no telemetry · zero runtime dependencies · scripted fetch in tests</text>
</svg>
